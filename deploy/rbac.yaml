apiVersion: v1
kind: ServiceAccount
metadata:
  name: skygo
  namespace: skygo
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skygo
  namespace: skygo
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skygo
  namespace: skygo
subjects:
  - kind: ServiceAccount
    name: skygo
    namespace: skygo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skygo
