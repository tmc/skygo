syntax = "proto3";
package skygo.v1;
option go_package = "github.com/tmc/skygo/gen/skygo/v1;skyv1";
import "google/protobuf/timestamp.proto";
// ControlService manages finite, single-node jobs on configured targets.
service ControlService {
  rpc PlanTask(PlanTaskRequest) returns (PlanTaskResponse);
  // Both submission methods share the accepted task and request identity shape.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  // SubmitRetryJob requires retry-aware admission; clients must not fall back to SubmitJob.
  // Reusing these messages keeps the additive method's acceptance contract identical.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc SubmitRetryJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc StreamJobLogs(StreamJobLogsRequest) returns (stream StreamJobLogsResponse);
  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse);
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
}
// Task is immutable after acceptance. Resource requests and limits are not capacity promises.
message Task {
  repeated string argv = 1;
  map<string, string> env = 2;
  string directory = 3;
  string image = 4;
  int64 cpu_millis = 5;
  int64 memory_bytes = 6;
  string accelerator = 7;
  int32 accelerator_count = 8;
  string target = 9;
  int64 timeout_seconds = 10;
  int64 cpu_limit_millis = 11;
  int64 memory_limit_bytes = 12;
  map<string, string> target_labels = 13;
  map<string, string> node_selector = 14;
  RetryPolicy retry = 15;
}
// RetryPolicy selects bounded attempts after qualified stopped failures.
message RetryPolicy {
  uint32 max_attempts = 1;
  uint32 delay_seconds = 2;
  repeated int32 exit_codes = 3;
}
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_STARTING = 2;
  JOB_STATE_RUNNING = 3;
  JOB_STATE_SUCCEEDED = 4;
  JOB_STATE_FAILED = 5;
  JOB_STATE_CANCELED = 6;
  JOB_STATE_UNKNOWN = 7;
  JOB_STATE_RETRYING = 8;
}
message Job {
  string id = 1;
  Task task = 2;
  string target = 3;
  JobState state = 4;
  bool cancel_requested = 5;
  string reason = 6;
  optional int32 exit_code = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  repeated Attempt attempts = 10;
  google.protobuf.Timestamp next_attempt_at = 11;
}
// Attempt describes one execution. Ordinals are one-based; timestamps record
// durable decisions, not exact native process start or exit times.
message Attempt {
  string id = 1;
  uint32 ordinal = 2;
  JobState state = 3;
  string reason = 4;
  optional int32 exit_code = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp starting_at = 7;
  google.protobuf.Timestamp finished_at = 8;
}
// Capability identifies implemented execution semantics, not available capacity.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_FINITE_JOBS_V1 = 1;
  CAPABILITY_RESOURCE_LIMITS_V1 = 2;
  CAPABILITY_NODE_SELECTOR_V1 = 3;
  CAPABILITY_TARGET_LABELS_V1 = 4;
  CAPABILITY_FINITE_JOB_RETRY_V1 = 5;
}
message Target {
  string name = 1;
  string kind = 2;
  repeated Capability capabilities = 3;
  map<string, string> labels = 4;
  repeated string accelerator_names = 5;
}
message Rejection {
  string target = 1;
  string reason = 2;
}
message PlanTaskRequest { Task task = 1; }
message PlanTaskResponse {
  string target = 1;
  repeated Rejection rejections = 2;
}
message SubmitJobRequest {
  Task task = 1;
  // Reuse this identifier on retries. A different task with the same ID is rejected.
  string request_id = 2;
}
message SubmitJobResponse { Job job = 1; }
message GetJobRequest { string id = 1; }
message GetJobResponse { Job job = 1; }
message ListJobsRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message ListJobsResponse {
  repeated Job jobs = 1;
  string next_page_token = 2;
}
message CancelJobRequest { string id = 1; }
message CancelJobResponse { Job job = 1; }
message StreamJobLogsRequest {
  string id = 1;
  int64 offset = 2;
  bool follow = 3;
  // Zero selects the current attempt once when the stream opens.
  uint32 attempt = 4;
}
// Offsets address the retained byte stream. Truncation is explicit, never silent.
message StreamJobLogsResponse {
  bytes data = 1;
  int64 next_offset = 2;
  bool complete = 3;
  bool truncated = 4;
  // Identifies the fixed selected attempt; omitted for an implicit default stream.
  string attempt_id = 5;
}
message ListTargetsRequest {}
message ListTargetsResponse { repeated Target targets = 1; }

message GetServerInfoRequest {}
// Capabilities apply only to their named target at this endpoint.
message GetServerInfoResponse { repeated Target targets = 1; }
