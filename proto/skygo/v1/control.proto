syntax = "proto3";
package skygo.v1;
option go_package = "github.com/tmc/skygo/gen/skygo/v1;skyv1";
import "google/protobuf/timestamp.proto";
// ControlService manages finite, single-node jobs on configured targets.
service ControlService {
  // QuoteTask returns advisory configured rates; it never changes submission placement.
  rpc QuoteTask(QuoteTaskRequest) returns (QuoteTaskResponse);
  rpc PlanTask(PlanTaskRequest) returns (PlanTaskResponse);
  // Both submission methods share the accepted task and request identity shape.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  // SubmitRetryJob requires retry-aware admission; clients must not fall back to SubmitJob.
  // Reusing these messages keeps the additive method's acceptance contract identical.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc SubmitRetryJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc StreamJobLogs(StreamJobLogsRequest) returns (stream StreamJobLogsResponse);
  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse);
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
  // Retained submission/log methods never fall back. Read-only discovery may
  // select legacy default submission only when GetRetention is unimplemented.
  rpc GetRetention(GetRetentionRequest) returns (GetRetentionResponse);
  rpc SubmitRetainedJob(SubmitRetainedJobRequest) returns (SubmitRetainedJobResponse);
  rpc PruneJobs(PruneJobsRequest) returns (PruneJobsResponse);
  rpc StreamRetainedJobLogs(StreamRetainedJobLogsRequest) returns (stream StreamRetainedJobLogsResponse);
  // Workspace submission never falls back to an older submit method.
  rpc SubmitWorkspaceJob(SubmitWorkspaceJobRequest) returns (SubmitWorkspaceJobResponse);
  // Data submission requires explicit endpoint and selected-target support; never fall back.
  rpc SubmitDataJob(SubmitDataJobRequest) returns (SubmitDataJobResponse);
  // Artifact transfers use bounded unary chunks, not whole-archive messages.
  rpc BeginArtifactUpload(BeginArtifactUploadRequest) returns (BeginArtifactUploadResponse);
  rpc GetArtifactUpload(GetArtifactUploadRequest) returns (GetArtifactUploadResponse);
  rpc WriteArtifactChunk(WriteArtifactChunkRequest) returns (WriteArtifactChunkResponse);
  rpc FinalizeArtifactUpload(FinalizeArtifactUploadRequest) returns (FinalizeArtifactUploadResponse);
  rpc CancelArtifactUpload(CancelArtifactUploadRequest) returns (CancelArtifactUploadResponse);
  rpc BeginArtifactDownload(BeginArtifactDownloadRequest) returns (BeginArtifactDownloadResponse);
  rpc ReadArtifactChunk(ReadArtifactChunkRequest) returns (ReadArtifactChunkResponse);
  rpc CloseArtifactDownload(CloseArtifactDownloadRequest) returns (CloseArtifactDownloadResponse);
  rpc RemoveArtifact(RemoveArtifactRequest) returns (RemoveArtifactResponse);

}
// Task is immutable after acceptance. Resource requests and limits are not capacity promises.
message Task {
  repeated string argv = 1;
  map<string, string> env = 2;
  string directory = 3;
  string image = 4;
  int64 cpu_millis = 5;
  int64 memory_bytes = 6;
  string accelerator = 7;
  int32 accelerator_count = 8;
  string target = 9;
  int64 timeout_seconds = 10;
  int64 cpu_limit_millis = 11;
  int64 memory_limit_bytes = 12;
  map<string, string> target_labels = 13;
  map<string, string> node_selector = 14;
  RetryPolicy retry = 15;
  // Requires directory empty; the server chooses each attempt's private root.
  ArtifactRef workdir = 16;
  // One explicit argv, at most 64 arguments and 16 KiB encoded; requires workdir.
  repeated string setup = 17;
  // At most 16 disjoint canonical relative roots, without glob expansion.
  repeated string outputs = 18;
  // Ordered mounts are immutable after acceptance; no implicit read-only default.
  repeated DataMount data_mounts = 19;
}
// DataMount names one configured reference and its canonical destination.
message DataMount {
  string reference = 1;
  string destination = 2;
  bool read_only = 3;
}
// RetryPolicy selects bounded attempts after qualified stopped failures.
message RetryPolicy {
  uint32 max_attempts = 1;
  uint32 delay_seconds = 2;
  repeated int32 exit_codes = 3;
}
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_STARTING = 2;
  JOB_STATE_RUNNING = 3;
  JOB_STATE_SUCCEEDED = 4;
  JOB_STATE_FAILED = 5;
  JOB_STATE_CANCELED = 6;
  JOB_STATE_UNKNOWN = 7;
  JOB_STATE_RETRYING = 8;
}
message Job {
  string id = 1;
  Task task = 2;
  string target = 3;
  JobState state = 4;
  bool cancel_requested = 5;
  string reason = 6;
  optional int32 exit_code = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  repeated Attempt attempts = 10;
  google.protobuf.Timestamp next_attempt_at = 11;
  ArtifactResult result = 12;
  // Output only: the accepted worker group, absent for a one-worker job.
  // Requests carry WorkerSpec beside the task, never in it.
  WorkerSpec workers = 13;
}
// WorkerMode selects how the ranks of a worker group relate. The zero value
// is rejected; there is no default mode.
enum WorkerMode {
  WORKER_MODE_UNSPECIFIED = 0;
  // Each rank runs the task with its own RANK and WORLD_SIZE.
  WORKER_MODE_INDEPENDENT = 1;
  // Ranks also get MASTER_ADDR and MASTER_PORT naming rank 0's listener.
  WORKER_MODE_TCP_RENDEZVOUS = 2;
}
// WorkerSpec is the fixed shape of a worker group. Count is range-checked as
// uint32 before any narrower conversion: 2..16 ranks in either mode, or 1
// only with INDEPENDENT, which is an ordinary one-worker job.
message WorkerSpec {
  uint32 count = 1;
  WorkerMode mode = 2;
}
// Attempt describes one execution. Ordinals are one-based; timestamps record
// durable decisions, not exact native process start or exit times.
message Attempt {
  string id = 1;
  uint32 ordinal = 2;
  JobState state = 3;
  string reason = 4;
  optional int32 exit_code = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp starting_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  ArtifactResult result = 9;
}
// Capability identifies implemented execution semantics, not available capacity.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_FINITE_JOBS_V1 = 1;
  CAPABILITY_RESOURCE_LIMITS_V1 = 2;
  CAPABILITY_NODE_SELECTOR_V1 = 3;
  CAPABILITY_TARGET_LABELS_V1 = 4;
  CAPABILITY_FINITE_JOB_RETRY_V1 = 5;
  // Endpoint-installed service fact, separate from selected-target support.
  CAPABILITY_ARTIFACT_SNAPSHOT_SERVICE_V1 = 6;
  // Advertised only by a target implementing the workspace lifecycle.
  CAPABILITY_WORKDIR_SNAPSHOT_V1 = 7;
  // Endpoint-installed worker transfer service, separate from target support.
  CAPABILITY_REMOTE_DATA_TRANSFER_V1 = 8;
  // Selected-target remote data execution support.
  CAPABILITY_REMOTE_DATA_V1 = 9;
  // Selected-target configured data mount support.
  CAPABILITY_DATA_MOUNTS_V1 = 10;
  // Selected-target remote retry support; also requires FINITE_JOB_RETRY_V1.
  CAPABILITY_REMOTE_DATA_RETRY_V1 = 11;
  // Reserved endpoint fact for WorkflowService. Not advertised until all four
  // handlers and Control workflow admission and cancellation exist.
  CAPABILITY_STATIC_WORKFLOWS_V1 = 12;
  // Reserved fact for WorkerGroupService indexed ranks. Not advertised until
  // the service is mounted and a selected target produces worker groups.
  CAPABILITY_INDEXED_WORKERS_V1 = 13;
  // Reserved fact for WORKER_MODE_TCP_RENDEZVOUS, withheld on the same terms.
  // No worker retry capability exists.
  CAPABILITY_TCP_RENDEZVOUS_V1 = 14;
  // Reserved endpoint fact for ServingService and its authenticated forward
  // route. Not advertised until both are mounted on a qualified service
  // controller with at least one configured service runtime.
  CAPABILITY_SERVICES_V1 = 15;
  // Reserved selected-target fact for fixed-replica services, withheld on
  // the same terms.
  CAPABILITY_FIXED_SERVICES_V1 = 16;
  // Reserved selected-target fact for service workdir, setup and approved
  // read-only mounts; also requires FIXED_SERVICES_V1.
  CAPABILITY_SERVICE_DATA_V1 = 17;
  // Reserved selected-target fact for CPU-utilization autoscaling; also
  // requires FIXED_SERVICES_V1. Configured support, not metrics availability.
  CAPABILITY_SERVICE_CPU_AUTOSCALING_V1 = 18;
  // Reserved endpoint fact for EnvironmentService and its authenticated
  // forward route. Not advertised until both are mounted on a controller
  // that persists session and expiry authority.
  CAPABILITY_ENVIRONMENTS_V1 = 19;
  // Reserved selected-target fact for persistent environments, withheld on
  // the same terms.
  CAPABILITY_PERSISTENT_ENVIRONMENTS_V1 = 20;
  // Reserved selected-target fact for environment artifact mounts; also
  // requires PERSISTENT_ENVIRONMENTS_V1. Not advertised until the target
  // materializes every mount read-only into each incarnation.
  CAPABILITY_ENVIRONMENT_ARTIFACTS_V1 = 21;
}
message Target {
  string name = 1;
  string kind = 2;
  repeated Capability capabilities = 3;
  map<string, string> labels = 4;
  repeated string accelerator_names = 5;
  // Discovery only; policy is fixed by the configured target, not by this client.
  DataPolicy data_policy = 6;
}
// DataPolicy describes the configured finite remote execution budgets in seconds.
message DataPolicy {
  int64 stage_seconds = 1;
  int64 collection_seconds = 2;
  int64 default_task_seconds = 3;
  int64 max_task_seconds = 4;
  int64 shutdown_seconds = 5;
}
message Rejection {
  string target = 1;
  string reason = 2;
}
message PlanTaskRequest { Task task = 1; }
message PlanTaskResponse {
  string target = 1;
  repeated Rejection rejections = 2;
}
message SubmitJobRequest {
  Task task = 1;
  // Reuse this identifier on retries. A different task with the same ID is rejected.
  string request_id = 2;
}
message SubmitJobResponse { Job job = 1; }
message GetJobRequest { string id = 1; }
message GetJobResponse { Job job = 1; }
message ListJobsRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message ListJobsResponse {
  repeated Job jobs = 1;
  string next_page_token = 2;
}
message CancelJobRequest { string id = 1; }
message CancelJobResponse { Job job = 1; }
message StreamJobLogsRequest {
  string id = 1;
  int64 offset = 2;
  bool follow = 3;
  // Zero selects the current attempt once when the stream opens.
  uint32 attempt = 4;
}
// Offsets address the retained byte stream. Truncation is explicit, never silent.
message StreamJobLogsResponse {
  bytes data = 1;
  int64 next_offset = 2;
  bool complete = 3;
  bool truncated = 4;
  // Identifies the fixed selected attempt; omitted for an implicit default stream.
  string attempt_id = 5;
}
message ListTargetsRequest {}
message ListTargetsResponse { repeated Target targets = 1; }

message GetServerInfoRequest {}
// Capabilities apply only to their named target at this endpoint.
message GetServerInfoResponse {
  repeated Target targets = 1;
  // Installed endpoint semantics, not capacity or artifact byte authority.
  repeated Capability capabilities = 2;
}

// RequestDomain is separate from Task and does not grant authority.
message RequestDomain {
  string lineage = 1;
  uint64 epoch = 2;
}
message GetRetentionRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message GetRetentionResponse {
  bool enabled = 1;
  RequestDomain domain = 2;
  google.protobuf.Timestamp accept_until = 3;
  google.protobuf.Timestamp retry_until = 4;
  google.protobuf.Timestamp epoch_zero_cutoff = 5;
  bool legacy_replay_open = 6;
  repeated RetentionTarget targets = 7;
  // Present only after fresh Admin authorization; contains no Task or environment.
  RetentionAdmin admin = 8;
}
enum OutputStorage {
  OUTPUT_STORAGE_UNSPECIFIED = 0;
  OUTPUT_STORAGE_LOCAL = 1;
  OUTPUT_STORAGE_REMOTE = 2;
}
message RetentionTarget {
  string target = 1;
  OutputStorage output_storage = 2;
  bool output_cleanup = 3;
  bool execution_cleanup = 4;
  uint64 output_reservation_bytes = 5;
}
enum RetentionQuotaDomain {
  RETENTION_QUOTA_DOMAIN_UNSPECIFIED = 0;
  RETENTION_QUOTA_DOMAIN_JOBS = 1;
  RETENTION_QUOTA_DOMAIN_TASK_BYTES = 2;
  RETENTION_QUOTA_DOMAIN_RETRY_BYTES = 3;
  RETENTION_QUOTA_DOMAIN_METADATA_BYTES = 4;
  RETENTION_QUOTA_DOMAIN_REQUEST_RECORDS = 5;
  RETENTION_QUOTA_DOMAIN_REQUEST_BYTES = 6;
  RETENTION_QUOTA_DOMAIN_CLEANUP_RECORDS = 7;
  RETENTION_QUOTA_DOMAIN_CLEANUP_BYTES = 8;
  RETENTION_QUOTA_DOMAIN_OUTPUT_BYTES = 9;
  RETENTION_QUOTA_DOMAIN_OUTPUT_DOMAINS = 10;
  RETENTION_QUOTA_DOMAIN_OUTPUT_FILES = 11;
  RETENTION_QUOTA_DOMAIN_PRINCIPAL_SCOPES = 12;
}
message RetentionUsage {
  RetentionQuotaDomain domain = 1;
  uint64 used = 2;
  uint64 limit = 3;
}
message RetentionAdmin {
  repeated RetentionUsage usage = 1;
  repeated RetentionObligation obligations = 2;
  string next_page_token = 3;
  optional uint64 database_file_bytes = 4;
  optional uint64 database_allocated_bytes = 5;
  optional uint64 filesystem_free_bytes = 6;
  optional uint64 output_allocated_bytes = 7;
  optional uint64 output_file_count = 8;
  uint64 reusable_database_bytes = 9;
  uint64 pending_cleanup_records = 10;
  // Bounded diagnostic codes, not workload or filesystem error text.
  repeated string conditions = 11;
  google.protobuf.Timestamp observed_at = 12;
}
message RetentionObligation {
  string id = 1;
  string job_id = 2;
  repeated string execution_ids = 3;
  string target = 4;
  string binding = 5;
  bool needs_manual = 6;
  bool output_pending = 7;
  bool execution_pending = 8;
  string reason = 9;
  google.protobuf.Timestamp created_at = 10;
}
message SubmitRetainedJobRequest {
  Task task = 1;
  string request_id = 2;
  RequestDomain domain = 3;
}
message SubmitRetainedJobResponse { Job job = 1; }
enum PruneMode {
  PRUNE_MODE_UNSPECIFIED = 0;
  PRUNE_MODE_WHOLE = 1;
  PRUNE_MODE_METADATA_ONLY = 2;
  PRUNE_MODE_OUTPUT_ONLY = 3;
  PRUNE_MODE_RESULT_ONLY = 4;
}
message PruneJobsRequest {
  google.protobuf.Timestamp before = 1;
  PruneMode mode = 2;
  bool acknowledge_unverified_terminal = 3;
  bool execute = 4;
  string obligation_id = 5;
  int32 page_size = 6;
  string page_token = 7;
  // One-based fixed result selector, required and nonzero for result-only.
  // Must be zero for other modes.
  uint32 attempt = 8;
}
message PruneJobsResponse {
  uint32 inspected = 1;
  uint32 selected = 2;
  uint32 marked = 3;
  uint32 skipped = 4;
  repeated PruneSkip skips = 5;
  repeated RetentionChargeTransfer transfers = 6;
  string next_page_token = 7;
  bool executed = 8;
}
message PruneSkip {
  string reason = 1;
  uint32 count = 2;
}
message RetentionChargeTransfer {
  RetentionQuotaDomain domain = 1;
  uint64 added = 2;
  uint64 released = 3;
}
message StreamRetainedJobLogsRequest {
  string id = 1;
  int64 offset = 2;
  bool follow = 3;
  uint32 attempt = 4;
  string cursor = 5;
}
message StreamRetainedJobLogsResponse {
  bytes data = 1;
  int64 next_offset = 2;
  bool complete = 3;
  bool truncated = 4;
  string attempt_id = 5;
  string cursor = 6;
}
enum RetentionExpiryReason {
  RETENTION_EXPIRY_REASON_UNSPECIFIED = 0;
  RETENTION_EXPIRY_REASON_RESULT_EXPIRED = 1;
  RETENTION_EXPIRY_REASON_REQUEST_EPOCH_EXPIRED = 2;
  RETENTION_EXPIRY_REASON_REQUEST_DOMAIN_REQUIRED = 3;
  RETENTION_EXPIRY_REASON_REQUEST_LINEAGE_CHANGED = 4;
  RETENTION_EXPIRY_REASON_LOGS_EXPIRED = 5;
}
// RetentionExpiry is carried in a Connect failed_precondition error detail.
message RetentionExpiry {
  RetentionExpiryReason reason = 1;
  // Only for an authorized RESULT_EXPIRED lookup with retained identity evidence.
  string job_id = 2;
}
// RetentionCapacity is carried in a Connect resource_exhausted error detail.
message RetentionCapacity {
  RetentionQuotaDomain domain = 1;
  uint64 used = 2;
  uint64 limit = 3;
}

// Money is a fixed-point amount. Presence distinguishes explicit zero from unknown.
message Money {
  optional int64 amount_micros = 1;
  string currency = 2;
}
// RateUnit is the denominator of an operator-configured rate.
enum RateUnit {
  RATE_UNIT_UNSPECIFIED = 0;
  RATE_UNIT_TARGET_HOUR = 1;
  RATE_UNIT_CPU_HOUR = 2;
  RATE_UNIT_ACCELERATOR_HOUR = 3;
}
// Gate A facts are configured, never live provider observations.
enum FactOrigin {
  FACT_ORIGIN_UNSPECIFIED = 0;
  FACT_ORIGIN_CONFIGURED = 1;
}
message Quote {
  Money rate = 1;
  RateUnit unit = 2;
  FactOrigin origin = 3;
  string source = 4;
  google.protobuf.Timestamp observed_at = 5;
  google.protobuf.Timestamp valid_until = 6;
}
enum CapacityState {
  CAPACITY_STATE_UNSPECIFIED = 0;
  CAPACITY_STATE_AVAILABLE = 1;
  CAPACITY_STATE_UNAVAILABLE = 2;
  CAPACITY_STATE_ERROR = 3;
}
enum CapacityFailureReason {
  CAPACITY_FAILURE_REASON_UNSPECIFIED = 0;
  CAPACITY_FAILURE_REASON_SOURCE_UNAVAILABLE = 1;
}
message CapacitySnapshot {
  CapacityState state = 1;
  optional uint32 available_slots = 2;
  FactOrigin origin = 3;
  string source = 4;
  google.protobuf.Timestamp observed_at = 5;
  google.protobuf.Timestamp valid_until = 6;
  CapacityFailureReason failure_reason = 7;
}
enum QuoteOutcome {
  QUOTE_OUTCOME_UNSPECIFIED = 0;
  QUOTE_OUTCOME_SELECTED = 1;
  QUOTE_OUTCOME_NO_ELIGIBLE_TARGET = 2;
  QUOTE_OUTCOME_NO_COMPARABLE_QUOTE = 3;
}
enum PriceStatus {
  PRICE_STATUS_UNSPECIFIED = 0;
  PRICE_STATUS_MISSING = 1;
  PRICE_STATUS_FUTURE = 2;
  PRICE_STATUS_STALE = 3;
  PRICE_STATUS_CURRENCY_MISMATCH = 4;
  PRICE_STATUS_UNIT_MISMATCH = 5;
  PRICE_STATUS_COMPARABLE = 6;
}
enum FactFreshness {
  FACT_FRESHNESS_UNSPECIFIED = 0;
  FACT_FRESHNESS_UNKNOWN = 1;
  FACT_FRESHNESS_FUTURE = 2;
  FACT_FRESHNESS_STALE = 3;
  FACT_FRESHNESS_FRESH = 4;
}
enum EstimateStatus {
  ESTIMATE_STATUS_UNSPECIFIED = 0;
  ESTIMATE_STATUS_QUOTE_NOT_COMPARABLE = 1;
  ESTIMATE_STATUS_DURATION_UNSPECIFIED = 2;
  ESTIMATE_STATUS_QUANTITY_UNSPECIFIED = 3;
  ESTIMATE_STATUS_AVAILABLE = 4;
}
enum ExcludedCharge {
  EXCLUDED_CHARGE_UNSPECIFIED = 0;
  EXCLUDED_CHARGE_STORAGE = 1;
  EXCLUDED_CHARGE_TRANSFER = 2;
  EXCLUDED_CHARGE_TAX = 3;
  EXCLUDED_CHARGE_LICENSES = 4;
  EXCLUDED_CHARGE_PROVIDER_ADJUSTMENTS = 5;
}
message QuoteCandidate {
  string target = 1;
  bool eligible = 2;
  string rejection = 3;
  Quote quote = 4;
  PriceStatus price_status = 5;
  CapacitySnapshot capacity = 6;
  FactFreshness capacity_freshness = 7;
  bool capacity_warning = 8;
  Money estimated_compute_cost = 9;
  EstimateStatus estimate_status = 10;
}
// QuoteTask always ranks comparable configured rates, with bytewise name ties.
message QuoteTaskRequest {
  Task task = 1;
  string currency = 2;
  RateUnit unit = 3;
  // User-declared total billable duration, never inferred from task timeout.
  optional int64 billable_duration_seconds = 4;
}
message QuoteTaskResponse {
  google.protobuf.Timestamp as_of = 1;
  string currency = 2;
  RateUnit unit = 3;
  optional int64 billable_duration_seconds = 4;
  QuoteOutcome outcome = 5;
  string selected_target = 6;
  uint32 comparison_count = 7;
  uint32 unpriced_eligible_count = 8;
  repeated QuoteCandidate candidates = 9;
  // This advisory compute estimate excludes each of these categories.
  repeated ExcludedCharge excluded_charges = 10;
}

// ArtifactRef is an immutable snapshot identity, never a path, URL or read grant.
// ID is 32 lowercase hexadecimal bytes, sha256 is 64, and size is 1..32 MiB.
message ArtifactRef {
  string id = 1;
  string sha256 = 2;
  int64 size = 3;
}
enum ArtifactUploadState {
  ARTIFACT_UPLOAD_STATE_UNSPECIFIED = 0;
  ARTIFACT_UPLOAD_STATE_CREATING = 1;
  ARTIFACT_UPLOAD_STATE_WRITABLE = 2;
  ARTIFACT_UPLOAD_STATE_FINALIZING = 3;
  ARTIFACT_UPLOAD_STATE_COMPLETE = 4;
  ARTIFACT_UPLOAD_STATE_DELETING = 5;
}
message ArtifactUpload {
  string id = 1;
  ArtifactRef reference = 2;
  int64 acknowledged = 3;
  google.protobuf.Timestamp expires_at = 4;
  ArtifactUploadState state = 5;
}
message BeginArtifactUploadRequest {
  string sha256 = 1;
  int64 size = 2;
}
message BeginArtifactUploadResponse { ArtifactUpload upload = 1; }
message GetArtifactUploadRequest { string id = 1; }
message GetArtifactUploadResponse { ArtifactUpload upload = 1; }
message WriteArtifactChunkRequest {
  string id = 1;
  int64 offset = 2;
  // Nonempty, at most 64 KiB; no sparse holes or partial acknowledged overlap.
  bytes data = 3;
}
message WriteArtifactChunkResponse { ArtifactUpload upload = 1; }
message FinalizeArtifactUploadRequest { string id = 1; }
message FinalizeArtifactUploadResponse { ArtifactRef reference = 1; }
message CancelArtifactUploadRequest { string id = 1; }
message CancelArtifactUploadResponse {}
message BeginArtifactDownloadRequest { ArtifactRef reference = 1; }
message BeginArtifactDownloadResponse {
  string id = 1;
  ArtifactRef reference = 2;
  google.protobuf.Timestamp expires_at = 3;
}
message ReadArtifactChunkRequest {
  string download_id = 1;
  int64 offset = 2;
  // Positive requested bytes, at most 64 KiB.
  int32 limit = 3;
}
message ReadArtifactChunkResponse {
  bytes data = 1;
  int64 next_offset = 2;
  bool complete = 3;
}
message CloseArtifactDownloadRequest { string download_id = 1; }
message CloseArtifactDownloadResponse {}
message RemoveArtifactRequest { ArtifactRef reference = 1; }
message RemoveArtifactResponse {}
message SubmitWorkspaceJobRequest {
  Task task = 1;
  string request_id = 2;
  // Present for retained requests; unchanged replay precedes current placement.
  RequestDomain domain = 3;
}
message SubmitWorkspaceJobResponse { Job job = 1; }
message SubmitDataJobRequest {
  Task task = 1;
  string request_id = 2;
  RequestDomain domain = 3;
}
message SubmitDataJobResponse { Job job = 1; }
enum ArtifactResultState {
  ARTIFACT_RESULT_STATE_UNSPECIFIED = 0;
  ARTIFACT_RESULT_STATE_ABSENT = 1;
  ARTIFACT_RESULT_STATE_AVAILABLE = 2;
  ARTIFACT_RESULT_STATE_EXPIRED = 3;
  ARTIFACT_RESULT_STATE_HELD = 4;
}
// ArtifactResult is authorized metadata for one fixed accepted attempt.
// EXPIRED is distinct from ABSENT and has no readable reference. A cached raw
// reference without a surviving grant returns generic not_found on byte access.
// Existing RetentionExpiry.RESULT_EXPIRED still denotes whole-job/request expiry.
message ArtifactResult {
  ArtifactResultState state = 1;
  ArtifactRef reference = 2;
  string attempt_id = 3;
}
