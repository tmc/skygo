version: 1
targets:
  - name: cpu-a
    kubeconfig: ./kubeconfig
    context: disposable
    namespace: skygo-a
    labels:
      location: lab
    resources:
      max_cpu_millis: 2000
      max_memory_bytes: 2147483648
  - name: gpu-b
    in_cluster: true
    namespace: skygo-b
    labels:
      location: lab
    resources:
      max_accelerators: 1
      node_selectors:
        skygo.test/model: [a100]
      accelerators:
        nvidia:
          resource_name: nvidia.com/gpu
        A100:
          resource_name: nvidia.com/gpu
          required_node_selector:
            skygo.test/model: a100
  # An experimental DRA target maps a portable accelerator name to one
  # standalone ResourceClaim and one Pod per attempt. It requires
  # --execution-state and --dra-state, a dedicated trusted namespace, and the
  # permissions in dra-rbac.yaml; see docs/dra.md.
  #
  # - name: dra-d
  #   in_cluster: true
  #   namespace: skygo-dra
  #   resources:
  #     max_accelerators: 8
  #     accelerators:
  #       h100:
  #         dra:
  #           device_class: gpu.example.com
  #           selectors:
  #             - 'device.attributes["gpu.example.com"].model == "H100"'
  #
  # A data target names its native qualification explicitly; without one it
  # refuses every data task. See the README.
